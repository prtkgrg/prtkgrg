    <text x="1216" y="266" text-anchor="end" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="1.5" fill="#8b8a84">PEOPLE REACHED BY SYSTEMS I BUILT</text>
