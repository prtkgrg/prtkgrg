<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#d4ff3f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4ff3f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#08090b"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- network, echoing the site hero -->
    <g stroke="#d4ff3f" stroke-opacity="0.18" stroke-width="1">
      <line x1="760" y1="60" x2="880" y2="120"/>
      <line x1="880" y1="120" x2="1010" y2="70"/>
      <line x1="880" y1="120" x2="930" y2="230"/>
      <line x1="1010" y1="70" x2="1150" y2="140"/>
      <line x1="930" y1="230" x2="1150" y2="140"/>
      <line x1="930" y1="230" x2="1060" y2="300"/>
      <line x1="1150" y1="140" x2="1230" y2="260"/>
      <line x1="1060" y1="300" x2="1230" y2="260"/>
      <line x1="760" y1="60" x2="700" y2="190"/>
      <line x1="700" y1="190" x2="930" y2="230"/>
    </g>
    <g fill="#ecebe6" fill-opacity="0.35">
      <circle cx="760" cy="60" r="2.5"/><circle cx="1010" cy="70" r="2.5"/>
      <circle cx="700" cy="190" r="2.5"/><circle cx="1060" cy="300" r="2.5"/>
      <circle cx="1230" cy="260" r="2.5"/>
    </g>
    <g fill="#d4ff3f">
      <circle cx="880" cy="120" r="10" fill-opacity="0.18"/><circle cx="880" cy="120" r="4"/>
      <circle cx="1150" cy="140" r="10" fill-opacity="0.18"/><circle cx="1150" cy="140" r="4"/>
      <circle cx="930" cy="230" r="3"/>
