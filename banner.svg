    <!-- left: identity -->
    <text x="64" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="#ecebe6">PG<tspan fill="#d4ff3f">.</tspan></text>
    <text x="128" y="81" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="1.5" fill="#8b8a84">PRATEEKGARG.DEV</text>

    <text x="62" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.5" fill="#ecebe6">Prateek Garg</text>
    <text x="64" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#ecebe6" fill-opacity="0.85">Lead Software Engineer</text>
    <text x="64" y="292" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="1.5" fill="#8b8a84">JAVA · SPRING BOOT · FLUTTER · REACT · OFFLINE-FIRST</text>

